# appeareance
font_family         Libertinus Mono
bold_font           Libertinus Mono Bold
italic_font         Libertinus Mono Italic
bold_italic_font    Libertinus BoldItali
symbol_map      U+0600-U+06FF,U+FB50-U+FDFF,U+FE70-U+FEFF SF Arabic
font_size 16.0

# cursor
cursor #1a1a1a
cursor_text_color #f2ede4
cursor_shape block
cursor_trail 1
shell_integration no-cursor
cursor_blink_interval 0.5 ease-in-out
cursor_stop_blinking_after 15.0

# background
background #1e1e2e
background_opacity 0.5

# window
confirm_os_window_close 0

# misc
enable_audio_bell no
copy_on_select yes
window_padding_width 5 10
allow_remote_control yes

include ~/.cache/hellwal/colors-kitty.conf
